name: PharMDTA
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.18
  - pip=25.2
  - pip:
      # CUDA 12.4 PyTorch wheels; runtime libraries are resolved by PyTorch.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torch-geometric==2.7.0
      - rdkit==2023.9.6
      - numpy==1.26.4
      - pandas==2.2.2
      - tqdm==4.66.5
